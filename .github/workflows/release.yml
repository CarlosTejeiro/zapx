name: Release

# Triggered on tag pushes shaped like `v1.2.3`.
#
# This (private) code repo builds the bundles and stages them on a release
# here, then the `mirror-to-public` job copies them to the PUBLIC releases
# repo where users download from.
#
# One-time setup (in addition to the Tauri signing secrets below):
# - Create the public releases repo (default: `CarlosTejeiro/zapx-releases`)
#   and set PUBLIC_RELEASES_REPO below if you use another name.
# - Create a Personal Access Token with `contents: write` on the releases
#   repo and add it to THIS repo's secrets as `RELEASES_TOKEN`
#   (the default GITHUB_TOKEN can only write to its own repo).
#
# Signing secrets (optional until in-app updates are enabled):
# - `TAURI_SIGNING_PRIVATE_KEY` / `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`.
#
# To cut a release:  git tag v0.7.0 && git push origin v0.7.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public repo that hosts the downloadable releases. Create it (public) and,
  # if you rename it, change it here.
  PUBLIC_RELEASES_REPO: CarlosTejeiro/zapx-releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libudev-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Stage the bundles on a (hidden) release in this private repo. The
      # mirror job below copies them to the public releases repo.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: 'ZAPX ${{ github.ref_name }}'
          releaseBody: 'Build staging — see the public releases repo.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Portable Windows build: the bare exe (frontend embedded) runs from
      # any folder without installation. Requires the WebView2 runtime on
      # the target machine (preinstalled on Win11 / updated Win10). Drop a
      # file named `portable` next to the exe to keep all data in `data/`.
      - name: Upload portable exe (Windows)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "target/${{ matrix.target }}/release" -Filter *.exe -File |
            Where-Object { $_.Name -notmatch 'setup' } | Select-Object -First 1
          if (-not $exe) { throw "release exe not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $portable = "ZAPX_${version}_x64_portable.exe"
          Copy-Item $exe.FullName $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber

  # Copy the staged bundles to the PUBLIC releases repo as a draft for review.
  # Additive: if this fails (e.g. RELEASES_TOKEN not set up yet), the staged
  # release in this repo is unaffected.
  mirror-to-public:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download staged bundles from this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --dir dist --clobber

      - name: Publish to the public releases repo (draft)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          if ! gh release view "$TAG" --repo "$PUBLIC_RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$PUBLIC_RELEASES_REPO" \
              --title "ZAPX $TAG" --notes-file "$notes" --draft
          else
            gh release edit "$TAG" --repo "$PUBLIC_RELEASES_REPO" --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/* --repo "$PUBLIC_RELEASES_REPO" --clobber
