name: Release

# Triggered on tag pushes shaped like `v1.2.3`. Builds platform-specific
# bundles (DMG/AppImage/deb on macOS+Linux, MSI/NSIS on Windows) plus the
# Windows portable exe, and attaches them to a draft Release on this repo.
#
# This repo is private; its Releases are private too (visible to the owner
# and collaborators only). That's intentional.
#
# Signing secrets (optional until in-app updates are enabled):
# - `TAURI_SIGNING_PRIVATE_KEY` / `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`.
#
# To cut a release:  git tag v0.7.0 && git push origin v0.7.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libudev-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: 'ZAPX ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Portable Windows build: the bare exe (frontend embedded) runs from
      # any folder without installation. Requires the WebView2 runtime on
      # the target machine (preinstalled on Win11 / updated Win10 — the
      # installers bootstrap it, the portable exe does not). Drop a file
      # named `portable` next to the exe to keep all data in `data/`.
      - name: Upload portable exe (Windows)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "target/${{ matrix.target }}/release" -Filter *.exe -File |
            Where-Object { $_.Name -notmatch 'setup' } | Select-Object -First 1
          if (-not $exe) { throw "release exe not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $portable = "ZAPX_${version}_x64_portable.exe"
          Copy-Item $exe.FullName $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber

  # Set the draft's body from docs/releases/<tag>.md once all builds finish.
  # Falls back to the placeholder body when no notes file exists for the tag.
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release notes from docs/releases/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$file" ]; then
            gh release edit "${{ github.ref_name }}" --notes-file "$file"
          else
            echo "No notes file at $file — keeping placeholder body."
          fi
