[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core-config",
    "crates/core-highlight",
    "crates/core-hints",
    "crates/core-logging",
    "crates/core-persistence",
    "crates/core-session",
    "crates/core-terminal",
    "crates/core-transport",
    "crates/core-vault",
    "xtask",
]

[workspace.package]
edition    = "2021"
version    = "0.0.1"
authors    = ["zapx contributors"]
license    = "Apache-2.0"
repository = "https://github.com/TBD/zapx"
rust-version = "1.80"

# ---------------------------------------------------------------------------
# Workspace-level dependency pins.
# Each crate opts in with `dep = { workspace = true }`.
# Versions are pinned to a major; Cargo.lock tracks the exact minor/patch.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime — tokio is the only runtime; never mix (style guide §2)
tokio   = { version = "1", features = ["full"] }
futures = "0.3"

# Error handling — thiserror in libs, anyhow only in app layer (style guide §2)
thiserror = "2"
anyhow    = "1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Credential zeroing — mandatory for secret-holding types (style guide §4)
zeroize = { version = "1", features = ["derive"] }

# Async traits — needed until AFIT is fully object-safe in stable Rust
async-trait = "0.1"

# Bloque 1 — local PTY and terminal emulation
portable-pty = "0.8"
vte          = "0.13"
uuid         = { version = "1", features = ["v4"] }

# Bloque 2 — SSH transport
russh      = "0.46"
russh-keys = "0.46"
russh-sftp = "2.1"

# Bloque 3 — persistence + vault
rusqlite = { version = "0.32", features = ["bundled"] }
keyring  = "3"

# Bloque 4 — serial transport
serialport  = "4"
tokio-serial = "5"

# Bloque 5 — keyword highlighting
regex = "1"

# Bloque 6 — session logging
chrono = { version = "0.4", features = ["serde"] }
