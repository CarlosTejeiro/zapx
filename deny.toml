[graph]
targets = []

# ---------------------------------------------------------------------------
# Licenses — only permissive licenses accepted
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Security advisories — deny all; exceptions require explicit justification
# ---------------------------------------------------------------------------
[advisories]
version = 2
ignore = []

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards         = "deny"

# ---------------------------------------------------------------------------
# Sources — only crates.io and our own workspace
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
