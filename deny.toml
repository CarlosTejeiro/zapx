[graph]
targets = []

# ---------------------------------------------------------------------------
# Licenses — dependencies must be permissive. ZAPX's own crates are
# GPL-3.0-or-later (publish = false) and are skipped via `private`.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8
# Don't license-check our own workspace crates — they're `publish = false`
# and licensed GPL-3.0-or-later, which this allow-list (for dependencies)
# intentionally does not include.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Security advisories — deny all; exceptions require explicit justification
# ---------------------------------------------------------------------------
[advisories]
version = 2
ignore = []

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards         = "deny"

# ---------------------------------------------------------------------------
# Sources — only crates.io and our own workspace
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
